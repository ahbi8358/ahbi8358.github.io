<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap">
<link rel="icon" href="{{ '/assets/img/favicon.svg' | relative_url }}" type="image/svg+xml">
<link rel="stylesheet" href="{{ '/assets/css/main.css' | relative_url }}?v={{ site.time | date: '%s' }}">
{% seo %}
{% if page.url == "/" %}
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "ProfilePage",
  "dateModified": "{{ site.time | date: '%Y-%m-%d' }}",
  "mainEntity": {
    "@type": "Person",
    "name": "{{ site.data.profile.name }}",
    "alternateName": "{{ site.data.profile.short_name }}",
    "description": "{{ site.description }}",
    "jobTitle": "Materials scientist (Ph.D., Materials Science and Engineering)",
    "url": "{{ site.url }}{{ site.baseurl }}/",
    "image": "{{ site.data.profile.photo | absolute_url }}",
    "alumniOf": [
      {"@type": "CollegeOrUniversity", "name": "University of Colorado Boulder"},
      {"@type": "CollegeOrUniversity", "name": "The American University in Cairo"},
      {"@type": "CollegeOrUniversity", "name": "Ain Shams University"}
    ],
    "knowsAbout": ["computational materials thermodynamics", "inverse materials design", "phase diagrams", "density functional theory", "predictive synthesis", "differential scanning calorimetry"],
    "sameAs": [{% for l in site.data.profile.links %}"{{ l.url }}"{% unless forloop.last %}, {% endunless %}{% endfor %}]
  }
}
</script>
{% endif %}
