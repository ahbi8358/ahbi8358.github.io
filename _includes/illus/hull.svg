<svg class="illus" viewBox="0 0 400 260" role="img" aria-labelledby="hull-t" xmlns="http://www.w3.org/2000/svg">
  <title id="hull-t">Convex hull of formation energies: compounds on the hull are stable, compounds above it are metastable or unstable</title>
  <defs>
    <linearGradient id="m-hull" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fafafa"/><stop offset=".2" stop-color="#a1a1aa"/><stop offset=".45" stop-color="#f4f4f5"/><stop offset=".7" stop-color="#71717a"/><stop offset="1" stop-color="#d4d4d8"/>
    </linearGradient>
  </defs>
  <g stroke="url(#m-hull)" stroke-width="2.5" fill="none" stroke-linecap="round">
    <path d="M40 210 H380"/><path d="M40 210 V30"/>
  </g>
  <g fill="#a1a1aa"><path d="M380 210 l-9 -4 v8 z"/><path d="M40 30 l-4 9 h8 z"/></g>
  <path d="M40 80 H380" stroke="#a1a1aa" stroke-width="1" stroke-dasharray="4 4"/>
  <text x="372" y="74" font-size="12" fill="#71717a" text-anchor="end">elements, ΔE = 0</text>
  <path d="M40 80 L130 150 L220 185 L300 160 L380 80" fill="none" stroke="#14532d" stroke-width="3" stroke-linejoin="round"/>
  <path d="M175 150 V167" stroke="#14532d" stroke-width="1.5" stroke-dasharray="3 3"/>
  <text x="182" y="160" font-size="12" fill="#14532d">ΔE above hull</text>
  <g fill="#fff" stroke="#71717a" stroke-width="1.8">
    <circle cx="100" cy="110" r="5"/><circle cx="175" cy="150" r="5"/><circle cx="250" cy="120" r="5"/><circle cx="330" cy="135" r="5"/>
  </g>
  <g fill="#14532d" stroke="#fff" stroke-width="2">
    <circle cx="40" cy="80" r="6"/><circle cx="130" cy="150" r="6"/><circle cx="220" cy="185" r="6"/><circle cx="300" cy="160" r="6"/><circle cx="380" cy="80" r="6"/>
  </g>
  <g font-size="13" fill="#52525b">
    <text x="40" y="230" text-anchor="middle">A</text><text x="380" y="230" text-anchor="middle">B</text>
    <text x="210" y="246" text-anchor="middle">composition</text>
    <text transform="translate(22 120) rotate(-90)" text-anchor="middle">formation energy</text>
  </g>
  <g font-size="12.5">
    <circle cx="222" cy="40" r="5" fill="#14532d"/><text x="232" y="44" fill="#0b0b0f">on the hull: stable</text>
    <circle cx="222" cy="60" r="4.5" fill="#fff" stroke="#71717a" stroke-width="1.8"/><text x="232" y="64" fill="#0b0b0f">above it: metastable</text>
  </g>
</svg>
