<svg class="illus" viewBox="0 0 400 260" role="img" aria-labelledby="hull-t" xmlns="http://www.w3.org/2000/svg">
  <title id="hull-t">Convex hull of formation energies: compounds on the hull are stable, compounds above it are metastable or unstable</title>
  <defs>
    <linearGradient id="h-bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#ecedf0"/></linearGradient>
    <linearGradient id="h-axis" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#52525b"/><stop offset=".45" stop-color="#a1a1aa"/><stop offset="1" stop-color="#3f3f46"/></linearGradient>
    <linearGradient id="h-gold" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f6e7b0"/><stop offset=".45" stop-color="#d4a83a"/><stop offset=".55" stop-color="#b8861f"/><stop offset="1" stop-color="#e2c070"/></linearGradient>
    <radialGradient id="h-green" cx=".35" cy=".3" r=".75"><stop offset="0" stop-color="#9be3b4"/><stop offset=".35" stop-color="#2f8f57"/><stop offset="1" stop-color="#0b3d20"/></radialGradient>
    <radialGradient id="h-silver" cx=".35" cy=".3" r=".75"><stop offset="0" stop-color="#ffffff"/><stop offset=".5" stop-color="#d4d4d8"/><stop offset="1" stop-color="#71717a"/></radialGradient>
    <filter id="h-sh" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="1.5" stdDeviation="1.5" flood-color="#000" flood-opacity=".28"/></filter>
    <filter id="h-glow" x="-10%" y="-30%" width="120%" height="160%"><feGaussianBlur stdDeviation="3.5"/></filter>
  </defs>
  <rect width="400" height="260" fill="url(#h-bg)"/>
  <g stroke="url(#h-axis)" stroke-width="2.5" fill="none" stroke-linecap="round"><path d="M40 210 H380"/><path d="M40 210 V30"/></g>
  <g fill="#52525b"><path d="M380 210 l-9 -4 v8 z"/><path d="M40 30 l-4 9 h8 z"/></g>
  <path d="M40 80 H380" stroke="#a1a1aa" stroke-width="1" stroke-dasharray="4 4"/>
  <text x="372" y="74" font-size="12" fill="#71717a" text-anchor="end">elements, ΔE = 0</text>
  <path d="M40 80 L130 150 L220 185 L300 160 L380 80" fill="none" stroke="#d4a83a" stroke-width="9" stroke-linejoin="round" opacity=".45" filter="url(#h-glow)"/>
  <path d="M40 80 L130 150 L220 185 L300 160 L380 80" fill="none" stroke="url(#h-gold)" stroke-width="4.5" stroke-linejoin="round" filter="url(#h-sh)"/>
  <path d="M175 150 V167" stroke="#8a6414" stroke-width="1.5" stroke-dasharray="3 3"/>
  <text x="182" y="160" font-size="12" font-weight="600" fill="#8a6414">ΔE above hull</text>
  <g fill="url(#h-silver)" stroke="#52525b" stroke-width=".8" filter="url(#h-sh)">
    <circle cx="100" cy="110" r="5.5"/><circle cx="175" cy="150" r="5.5"/><circle cx="250" cy="120" r="5.5"/><circle cx="330" cy="135" r="5.5"/>
  </g>
  <g fill="url(#h-green)" stroke="#f6e7b0" stroke-width="1.2" filter="url(#h-sh)">
    <circle cx="40" cy="80" r="7"/><circle cx="130" cy="150" r="7"/><circle cx="220" cy="185" r="7"/><circle cx="300" cy="160" r="7"/><circle cx="380" cy="80" r="7"/>
  </g>
  <g font-size="13" fill="#3f3f46">
    <text x="40" y="230" text-anchor="middle">A</text><text x="380" y="230" text-anchor="middle">B</text>
    <text x="210" y="246" text-anchor="middle">composition</text>
    <text transform="translate(22 120) rotate(-90)" text-anchor="middle">formation energy</text>
  </g>
  <g font-size="12.5" font-weight="600">
    <circle cx="222" cy="40" r="6" fill="url(#h-green)" filter="url(#h-sh)"/><text x="234" y="44" fill="#14532d">on the hull: stable</text>
    <circle cx="222" cy="60" r="5" fill="url(#h-silver)" stroke="#52525b" stroke-width=".8" filter="url(#h-sh)"/><text x="234" y="64" fill="#3f3f46">above it: metastable</text>
  </g>
</svg>
