  </g>
  <g text-anchor="middle" fill="#14532d">
    <text x="200" y="126" font-size="13" font-weight="800" letter-spacing="2">INVERSE</text>
    <text x="200" y="141" font-size="13" font-weight="800" letter-spacing="2">DESIGN</text>
