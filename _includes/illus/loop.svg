    <polygon points="0,-8 13,0 0,8" transform="translate(143.4 186.6) rotate(225)"/>
    <polygon points="0,-8 13,0 0,8" transform="translate(143.4 73.4) rotate(315)"/>
    <polygon points="0,-8 13,0 0,8" transform="translate(256.6 73.4) rotate(45)"/>
  </g>
  <g filter="url(#l-sh)">
    <rect x="140" y="33" width="120" height="34" rx="9" fill="url(#l-green)"/>
    <rect x="266" y="113" width="124" height="34" rx="9" fill="url(#l-gold)"/>
    <rect x="130" y="193" width="140" height="34" rx="9" fill="url(#l-graphite)"/>
    <rect x="10" y="113" width="124" height="34" rx="9" fill="url(#l-green)"/>
  </g>
  <g fill="url(#l-sheen)">
