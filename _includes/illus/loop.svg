    <rect x="132" y="195" width="136" height="13" rx="7"/><rect x="12" y="115" width="120" height="13" rx="7"/>
  </g>
  <g font-size="13" font-weight="700" text-anchor="middle">
    <text x="200" y="54" fill="#fff">target property</text>
    <text x="328" y="128" fill="#3b2a06">candidate</text><text x="328" y="141" fill="#3b2a06">compositions</text>
    <text x="200" y="208" fill="#fff">stability check</text><text x="200" y="221" font-weight="400" font-size="12" fill="#e4e4e7">ΔG(T, p, μ), hull</text>
