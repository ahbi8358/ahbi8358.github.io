<svg class="illus" viewBox="0 0 400 260" role="img" aria-labelledby="loop-t" xmlns="http://www.w3.org/2000/svg">
  <title id="loop-t">Inverse design loop: a target property, candidate compositions, stability checks, then what to make and how, feeding back to the target</title>
  <defs>
    <linearGradient id="l-bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#ecedf0"/></linearGradient>
    <linearGradient id="l-ring" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f6e7b0"/><stop offset=".3" stop-color="#b8861f"/><stop offset=".55" stop-color="#f3dc95"/><stop offset=".8" stop-color="#9a6d16"/><stop offset="1" stop-color="#e2c070"/></linearGradient>
    <linearGradient id="l-green" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#3fa86a"/><stop offset=".48" stop-color="#1c6b3c"/><stop offset=".52" stop-color="#14532d"/><stop offset="1" stop-color="#0b3d20"/></linearGradient>
    <linearGradient id="l-gold" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f8e9b5"/><stop offset=".48" stop-color="#ddb44c"/><stop offset=".52" stop-color="#c99a2e"/><stop offset="1" stop-color="#a87a1a"/></linearGradient>
    <linearGradient id="l-graphite" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#6b6b74"/><stop offset=".48" stop-color="#3a3a41"/><stop offset=".52" stop-color="#2a2a30"/><stop offset="1" stop-color="#17171b"/></linearGradient>
    <linearGradient id="l-sheen" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".55"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
    <filter id="l-sh" x="-20%" y="-30%" width="140%" height="170%"><feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#000" flood-opacity=".3"/></filter>
  </defs>
  <rect width="400" height="260" fill="url(#l-bg)"/>
  <circle cx="200" cy="130" r="80" fill="none" stroke="url(#l-ring)" stroke-width="10" filter="url(#l-sh)"/>
  <circle cx="200" cy="130" r="76" fill="none" stroke="#fff" stroke-width="1" opacity=".6"/>
  <g fill="#8a6414">
