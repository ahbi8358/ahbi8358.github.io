    </linearGradient>
  </defs>
  <circle cx="200" cy="130" r="80" fill="none" stroke="url(#m-loop)" stroke-width="9"/>
  <circle cx="200" cy="130" r="80" fill="none" stroke="#14532d" stroke-width="1" opacity=".35"/>
  <g fill="#14532d">
