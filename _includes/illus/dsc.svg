<svg class="illus" viewBox="0 0 400 260" role="img" aria-labelledby="dsc-t" xmlns="http://www.w3.org/2000/svg">
  <title id="dsc-t">Three DSC heat-flow curves at 5, 10 and 20 kelvin per minute: the same transition appears later and broader as the heating rate rises</title>
  <defs>
    <linearGradient id="m-dsc" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fafafa"/><stop offset=".2" stop-color="#a1a1aa"/><stop offset=".45" stop-color="#f4f4f5"/><stop offset=".7" stop-color="#71717a"/><stop offset="1" stop-color="#d4d4d8"/>
    </linearGradient>
  </defs>
  <g stroke="url(#m-dsc)" stroke-width="2.5" fill="none" stroke-linecap="round">
    <path d="M40 222 H380"/><path d="M40 222 V30"/>
  </g>
  <g fill="#a1a1aa"><path d="M380 222 l-9 -4 v8 z"/><path d="M40 30 l-4 9 h8 z"/></g>
  <path d="M158 36 V222" stroke="#14532d" stroke-width="1.2" stroke-dasharray="4 3"/>
  <text x="158" y="30" font-size="12" fill="#14532d" text-anchor="middle">true transition</text>
  <path d="M40 200 L160 200 C172 200 174 146 178 146 C184 146 190 182 215 200 L380 200" fill="none" stroke="#14532d" stroke-width="2.4"/>
  <path d="M40 155 L163 155 C182 155 184 96 190 96 C198 96 205 135 245 155 L380 155" fill="none" stroke="#15803d" stroke-width="2.4"/>
  <path d="M40 110 L166 110 C194 110 198 46 208 46 C218 46 228 88 285 110 L380 110" fill="none" stroke="#3f8f5f" stroke-width="2.4"/>
  <g font-size="12.5" font-weight="600">
    <text x="384" y="204" fill="#14532d" text-anchor="end" transform="translate(-6 -8)">5 K/min</text>
    <text x="384" y="159" fill="#15803d" text-anchor="end" transform="translate(-6 -8)">10 K/min</text>
    <text x="384" y="114" fill="#3f8f5f" text-anchor="end" transform="translate(-6 -8)">20 K/min</text>
  </g>
  <path d="M160 236 H210" stroke="#71717a" stroke-width="1.2"/><path d="M210 236 l-7 -3 v6 z" fill="#71717a"/>
  <text x="216" y="239" font-size="12" fill="#52525b">lag grows with heating rate</text>
  <g font-size="13" fill="#52525b">
    <text x="210" y="254" text-anchor="middle">temperature</text>
    <text transform="translate(22 126) rotate(-90)" text-anchor="middle">heat flow (endo ↑)</text>
  </g>
</svg>
