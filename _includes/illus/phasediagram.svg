<svg class="illus" viewBox="0 0 400 260" role="img" aria-labelledby="pd-t" xmlns="http://www.w3.org/2000/svg">
  <title id="pd-t">A binary eutectic phase diagram whose liquidus carries an uncertainty band and measured points with error bars</title>
  <defs>
    <linearGradient id="m-pd" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fafafa"/><stop offset=".2" stop-color="#a1a1aa"/><stop offset=".45" stop-color="#f4f4f5"/><stop offset=".7" stop-color="#71717a"/><stop offset="1" stop-color="#d4d4d8"/>
    </linearGradient>
  </defs>
  <g stroke="url(#m-pd)" stroke-width="2.5" fill="none" stroke-linecap="round">
    <path d="M40 210 H380"/><path d="M40 210 V30"/>
  </g>
  <g fill="#a1a1aa"><path d="M380 210 l-9 -4 v8 z"/><path d="M40 30 l-4 9 h8 z"/></g>
  <path d="M40 54 Q120 122 200 160 Q280 112 380 72 L380 90 Q280 130 200 182 Q120 140 40 68 Z" fill="#15803d" opacity=".18"/>
  <path d="M40 60 Q120 130 200 170 Q280 120 380 80" fill="none" stroke="#14532d" stroke-width="2.6"/>
